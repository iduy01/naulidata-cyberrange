# Cyber Range: "Cookies Reuse & MFA Bypass" — Red vs. Blue lab
#
# Deploy inside a single Linux VM intended for a Proxmox environment.
#
# This compose file lives in ./docker/, the application source in ./application/
# and the provisioning scripts in ./scripts/ — all paths below are relative to
# THIS file, so always run compose against it explicitly:
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# (or simply run the wrapper:  sudo bash scripts/provision.sh)
#
# Services
#   app   — vulnerable Node.js "Admin Feedback System"      -> host :3075
#   sshd  — Blue Team SSH access (analyst / blue_team_rocks) -> host :2275
#   bot   — simulated administrator that reviews /dashboard
#
# The shared volume ../logs is mounted at /opt/admin/logs in BOTH app and sshd,
# so the Blue Team can read access.log / error.log over SSH (path required by
# the assessment: /opt/admin/logs).

name: cyberrange

services:
  app:
    build:
      context: ../application/app
      dockerfile: ../../docker/app.Dockerfile
    container_name: cyberrange-app
    hostname: feedback
    ports:
      - "3075:3075"
    volumes:
      - ../logs:/opt/admin/logs
      - ../scripts:/usr/src/app/scripts:ro
    environment:
      - PORT=3075
      - LOG_DIR=/opt/admin/logs
      - ADMIN_USER=admin
      - ADMIN_PASS=Adm1n@Feedback2026
      - MFA_CODE=123456
    networks:
      range:
        aliases:
          # NOTE: never use a bare `app` hostname — the `.app` TLD is on the
          # Chromium HSTS preload list, so http://app:3075 is force-upgraded to
          # HTTPS inside the headless browser. These aliases avoid that trap.
          - feedback
          - feedback.admin.local
    restart: unless-stopped

  bot:
    build:
      context: ../application/bot
      dockerfile: ../../docker/bot.Dockerfile
    container_name: cyberrange-bot
    depends_on:
      - app
    environment:
      - APP_URL=http://feedback:3075
      - ADMIN_USER=admin
      - ADMIN_PASS=Adm1n@Feedback2026
      - MFA_CODE=123456
      - REVIEW_INTERVAL_MS=20000
    networks:
      - range
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: cyberrange-sshd
    hostname: analyst-box
    ports:
      - "2275:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
      - USER_NAME=analyst
      - USER_PASSWORD=blue_team_rocks
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=false
    volumes:
      - ../logs:/opt/admin/logs
    networks:
      - range
    restart: unless-stopped

networks:
  range:
    driver: bridge
